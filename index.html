<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redeem</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 20%, #3d0a4e 0%, #1a0633 45%, #000000 100%);
    position: relative;
    overflow-x: hidden;
  }

  .sparkles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .sparkles span {
    position: absolute;
    border-radius: 9999px;
    background: rgba(255,122,24,0.6);
    animation: floatUp 5s ease-in-out infinite;
  }
  @keyframes floatUp {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(-14px); opacity: 1; }
  }

  .container { width: 100%; max-width: 384px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10; }

  .promo {
    width: 100%;
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background-color: #1a0633;
    border: 1px solid rgba(255,122,24,0.5);
    box-shadow: 0 0 20px rgba(255,122,24,0.25);
    margin-bottom: 24px;
  }
  .promo-icon {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 9999px;
    background: rgba(255,122,24,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .promo-text { display: flex; flex-direction: column; }
  .promo-title { color: #fff; font-weight: 600; font-size: 14px; line-height: 1.2; }
  .promo-sub { color: rgba(255,170,80,0.85); font-size: 12px; }

  h1 {
    color: #ff7a18;
    font-weight: 700;
    text-transform: lowercase;
    font-size: 48px;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    text-shadow: 0 0 18px rgba(255,122,24,0.6);
  }
  .subhead {
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 6px;
  }

  form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  input {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }
  input:focus { border-color: #ff7a18; }

  button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
    background: linear-gradient(135deg, #b34a00 0%, #ff7a18 100%);
    box-shadow: 0 0 18px rgba(255,122,24,0.4);
  }
  button:disabled { opacity: 0.7; }

  .countdown { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; }
  .countdown span { color: #ffb380; font-size: 12px; font-weight: 600; }

  .verify-box { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 8px; }
  .verify-box p { color: rgba(255,255,255,0.9); font-size: 12px; text-align: center; }
  .verify-box a {
    width: 100%;
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(135deg, #b34a00 0%, #ff7a18 100%);
    box-shadow: 0 0 18px rgba(255,122,24,0.4);
  }
  .error { color: #f87171; font-size: 12px; text-align: center; margin-top: 4px; }

  .disclaimer { color: rgba(255,255,255,0.4); font-size: 10px; text-align: center; margin-top: 24px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 9999px;
    background: rgba(26,6,51,0.92);
    border: 1px solid rgba(255,122,24,0.4);
    box-shadow: 0 0 16px rgba(255,122,24,0.3);
    opacity: 0;
    transition: all 0.5s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .avatar {
    width: 24px; height: 24px; border-radius: 9999px;
    background: rgba(255,122,24,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .toast .text { color: #fff; font-size: 12px; }
  .toast .text b { color: #ffb380; }
</style>
</head>
<body>
  <div class="sparkles" id="sparkles"></div>

  <div class="container">
    <div class="promo">
      <div class="promo-icon">👻</div>
      <div class="promo-text">
        <span class="promo-title">25,000 Robux Code: SECRET4</span>
        <span class="promo-sub">Only 20 codes remaining.</span>
      </div>
    </div>

    <h1>redeem</h1>
    <div class="subhead">✨ Limited Halloween drop — claim before it's gone</div>

    <form id="redeemForm">
      <input type="text" id="code" value="SECRET4" placeholder="Code" />
      <input type="text" id="username" placeholder="Roblox Username" />
      <button type="submit" id="redeemBtn">Redeem</button>
      <div class="countdown"><span>🔥 Offer ends in <span id="timer">14:59</span></span></div>
      <div id="message"></div>
    </form>

    <p class="disclaimer">⚠ Not affiliated with Roblox. For entertainment purposes only.</p>
  </div>

  <div class="toast" id="toast">
    <div class="avatar">👻</div>
    <div class="text"><b id="toastUser"></b> just redeemed 25,000 Robux</div>
  </div>

  <script>
    // Sparkles
    const sparkles = document.getElementById('sparkles');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      const size = 2 + (i % 3);
      s.style.left = (i * 73) % 100 + '%';
      s.style.top = (i * 41) % 100 + '%';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.animationDelay = (i * 0.7) % 4 + 's';
      s.style.animationDuration = (4 + (i % 3)) + 's';
      sparkles.appendChild(s);
    }

    // Countdown
    let mins = 14, secs = 59;
    const timerEl = document.getElementById('timer');
    setInterval(() => {
      secs -= 1;
      if (secs < 0) { secs = 59; mins -= 1; if (mins < 0) { mins = 14; secs = 59; } }
      timerEl.textContent = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
    }, 1000);

    // Recent redemptions toast
    const users = ["xX_GamerPro_Xx","RobloxFan_2024","NoobMaster99","BuildermanJR","PixelQueen","DarkNinja_07","SusieSunshine","EpicGamer_YT"];
    const toast = document.getElementById('toast');
    const toastUser = document.getElementById('toastUser');
    let ui = 0;
    function showToast() {
      toastUser.textContent = users[ui % users.length];
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
      ui += 1;
    }
    setTimeout(showToast, 2500);
    setInterval(showToast, 6000);

    // Form
    const form = document.getElementById('redeemForm');
    const codeInput = document.getElementById('code');
    const usernameInput = document.getElementById('username');
    const btn = document.getElementById('redeemBtn');
    const message = document.getElementById('message');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const code = codeInput.value.trim();
      const username = usernameInput.value.trim();
      if (!code || !username) {
        message.innerHTML = '<p class="error">Please enter both a code and username.</p>';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Redeeming...';
      message.innerHTML = '';
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Redeem';
        message.innerHTML = `
          <div class="verify-box">
            <p>For security reasons u must complete 1 quest for ur code to be delivered</p>
            <a href="#" onclick="event.preventDefault(); showQuest();" style="display:block;width:100%;border-radius:12px;padding:12px 16px;color:#fff;font-weight:700;font-size:14px;text-align:center;text-decoration:none;background:linear-gradient(135deg,#b34a00 0%,#ff7a18 100%);box-shadow:0 0 18px rgba(255,122,24,0.4);cursor:pointer;">Start Quest</a>
          </div>`;
      }, 1200);
    });

    // QUEST FUNCTIONS
    function showQuest() {
      document.getElementById('questModal').style.display = 'flex';
      document.getElementById('questMessage').innerHTML = '';
    }

    function closeQuest() {
      document.getElementById('questModal').style.display = 'none';
    }

    function submitQuest() {
      const name = document.getElementById('questName').value.trim();
      const email = document.getElementById('questEmail').value.trim();
      const answer = document.getElementById('questAnswer').value.trim();
      const msgDiv = document.getElementById('questMessage');

      if (!name || !email || !answer) {
        msgDiv.innerHTML = '<p style="color:#f87171;font-size:12px;text-align:center;margin-top:8px;">Please fill in all fields.</p>';
        return;
      }

      if (answer !== '8') {
        msgDiv.innerHTML = '<p style="color:#f87171;font-size:12px;text-align:center;margin-top:8px;">❌ Wrong answer! Try again.</p>';
        return;
      }

      msgDiv.innerHTML = `
        <p style="color:#4ade80;font-size:14px;text-align:center;margin-top:8px;">✅ Quest complete!</p>
        <p style="color:#ff7a18;font-size:20px;font-weight:700;text-align:center;margin:10px 0;">🎁 Your Code: <span style="background:rgba(255,122,24,0.2);padding:4px 12px;border-radius:6px;">ROBUX-2024</span></p>
        <p style="color:rgba(255,255,255,0.6);font-size:12px;text-align:center;">Code sent to: ${email}</p>
      `;

      setTimeout(() => { closeQuest(); }, 5000);
    }

    // Close modal when clicking outside
    document.getElementById('questModal').addEventListener('click', function(e) {
      if (e.target === this) closeQuest();
    });
  </script>

  <!-- QUEST MODAL (added at the bottom) -->
  <div id="questModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#1a0633;padding:30px;border-radius:16px;max-width:400px;width:90%;border:1px solid rgba(255,122,24,0.5);">
      <h2 style="color:#ff7a18;margin-top:0;">🔐 Verification Quest</h2>
      <p style="color:rgba(255,255,255,0.8);">Complete this quest to get your Robux code:</p>
      
      <input type="text" id="questName" placeholder="Your full name" style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);border-radius:10px;padding:12px 16px;color:#fff;font-size:14px;margin:8px 0;outline:none;box-sizing:border-box;" />
      <input type="email" id="questEmail" placeholder="Your email address" style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);border-radius:10px;padding:12px 16px;color:#fff;font-size:14px;margin:8px 0;outline:none;box-sizing:border-box;" />
      <input type="text" id="questAnswer" placeholder="What is 5 + 3?" style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);border-radius:10px;padding:12px 16px;color:#fff;font-size:14px;margin:8px 0;outline:none;box-sizing:border-box;" />
      
      <button onclick="submitQuest()" style="width:100%;border:none;border-radius:10px;padding:12px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;background:linear-gradient(135deg,#b34a00 0%,#ff7a18 100%);box-shadow:0 0 18px rgba(255,122,24,0.4);">Submit Quest</button>
      <button onclick="closeQuest()" style="width:100%;border:none;border-radius:10px;padding:12px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;background:rgba(255,255,255,0.1);">Cancel</button>
      
      <div id="questMessage"></div>
    </div>
  </div>

</body>
</html>
