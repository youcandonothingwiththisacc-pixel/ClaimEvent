<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redeem</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#12001f;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

h1{
    color:#fff;
    font-size:70px;
    margin-bottom:20px;
}

.subtitle{
    color:#fff;
    font-size:22px;
    margin-bottom:10px;
}

.stock{
    color:#57ff6d;
    font-size:20px;
    font-weight:bold;
    margin-bottom:30px;
}

input{
    width:100%;
    height:70px;
    border:3px solid #fff;
    border-radius:20px;
    background:transparent;
    color:#fff;
    font-size:28px;
    padding:0 20px;
    outline:none;
}

input::placeholder{
    color:#ddd;
}

button{
    width:100%;
    height:70px;
    margin-top:30px;
    border:none;
    border-radius:20px;
    background:linear-gradient(90deg,#7d2cff,#a32cff,#7d2cff);
    color:#fff;
    font-size:30px;
    cursor:pointer;
}

#questPage{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#questPage h2{
    color:white;
    font-size:40px;
    margin-bottom:30px;
}
</style>

</head>
<body>

<div id="landingPage" class="container">
    <h1>Redeem</h1>

    <p class="subtitle">🚀 Enter your Roblox username</p>

    <div class="stock">
        🟢 27 Stock
    </div>

    <input id="username" type="text" placeholder="Username">

    <button onclick="redeem()">Continue</button>
</div>

<div id="questPage" class="container">
    <h2>Must Complete 2 Quests</h2>

    <button onclick="startOffer()">Complete Quests</button>
</div>

<script>
function redeem() {
    const username = document.getElementById("username").value.trim();

    if (username === "") {
        alert("Please enter your Roblox username.");
        return;
    }

    localStorage.setItem("username", username);

    document.getElementById("landingPage").style.display = "none";
    document.getElementById("questPage").style.display = "flex";
}

function startOffer() {
    window.location.href = "https://locked-content.com/?9ded58f";
}
</script>

</body>
</html>
