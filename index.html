<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redeem</title>
<p class="subtitle">🚀 Enter your Roblox username</p>

<div class="stock">
    🟢 <span id="stock">27</span> Stock
</div>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#12001f;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

h1{
    color:#fff;
    font-size:70px;
    font-weight:700;
    margin-bottom:60px;
}

input{
    width:100%;
    height:70px;
    border:3px solid #fff;
    border-radius:20px;
    background:transparent;
    color:#fff;
    font-size:28px;
    padding:0 20px;
    outline:none;
}

input::placeholder{
    color:#ddd;
}

button{
    width:100%;
    height:70px;
    margin-top:30px;
    border:none;
    border-radius:20px;
    background:linear-gradient(90deg,#7d2cff,#a32cff,#7d2cff);
    color:#fff;
    font-size:30px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.02);
}

button:active{
    transform:scale(.98);
}
</style>

</head>
<body>

<div class="container">
    <h1>Redeem</h1>

    <input id="username" type="text" placeholder="Username">

    <button onclick="redeem()">Continue</button>
</div>

<script>
function redeem() {
    const username = document.getElementById("username").value.trim();

    if (username === "") {
        alert("Please enter your username.");
        return;
    }

    // Optional: save username
    localStorage.setItem("username", username);

    // Redirect
    window.location.href = "https://locked-content.com/?9ded58f";
}
</script>

</body>
</html>
<div id="questPage" style="display:none;">
    <h2>Must Complete 2 Quests</h2>

    <button onclick="startOffer()">
        Complete Quests
    </button>
</div>
