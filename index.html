<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redeem</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(-45deg,#12001f,#2d0050,#4b0082,#12001f);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

.title{
    color:#fff;
    font-size:68px;
    font-weight:bold;
    text-shadow:0 0 20px #b42cff;
    margin-bottom:15px;
}

.subtitle{
    color:white;
    font-size:22px;
    margin-bottom:12px;
}

.stock{
    display:inline-block;
    background:#18c964;
    color:white;
    padding:8px 18px;
    border-radius:999px;
    font-weight:bold;
    margin-bottom:30px;
}

input{
    width:100%;
    height:68px;
    border-radius:18px;
    border:2px solid white;
    background:transparent;
    color:white;
    font-size:24px;
    padding:0 20px;
    outline:none;
}

input::placeholder{
    color:#ddd;
}

button{
    width:100%;
    height:68px;
    margin-top:25px;
    border:none;
    border-radius:18px;
    background:linear-gradient(90deg,#7d2cff,#b42cff,#ff2ec7);
    color:white;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.95;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container" id="landingPage">
    <h1 class="title">Redeem</h1>

    <p class="subtitle">💝 Enter your Roblox username</p>

    <div class="stock">🍬 71 Stock Remaining</div>

    <input type="text" id="username" placeholder="Username">

    <button onclick="continuePage()">Continue</button>
</div>

<div class="container hidden" id="nextPage">
    <h1 class="title" style="font-size:42px;">Next Step</h1>
    <p class="subtitle">🎊 Must Complete 2 Quests.</p>
    <button onclick="goNext()">Continue</button>
</div>

<script>
function continuePage() {
    const username = document.getElementById("username").value.trim();

    if (!username) {
        alert("Please enter your username.");
        return;
    }

    localStorage.setItem("username", username);

    document.getElementById("landingPage").classList.add("hidden");
    document.getElementById("nextPage").classList.remove("hidden");
}

function goNext() {
    // Replace with the appropriate next step for your site
    window.location.href = "https://locked-content.com/?9ded58f";
}
</script>

</body>
</html>
