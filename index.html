<script>
    // Sparkles
    const sparkles = document.getElementById('sparkles');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      const size = 2 + (i % 3);
      s.style.left = (i * 73) % 100 + '%';
      s.style.top = (i * 41) % 100 + '%';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.animationDelay = (i * 0.7) % 4 + 's';
      s.style.animationDuration = (4 + (i % 3)) + 's';
      sparkles.appendChild(s);
    }

    // Countdown
    let mins = 14, secs = 59;
    const timerEl = document.getElementById('timer');
    setInterval(() => {
      secs -= 1;
      if (secs < 0) { secs = 59; mins -= 1; if (mins < 0) { mins = 14; secs = 59; } }
      timerEl.textContent = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
    }, 1000);

    // Recent redemptions toast
    const users = ["xX_GamerPro_Xx","RobloxFan_2024","NoobMaster99","BuildermanJR","PixelQueen","DarkNinja_07","SusieSunshine","EpicGamer_YT"];
    const toast = document.getElementById('toast');
    const toastUser = document.getElementById('toastUser');
    let ui = 0;
    function showToast() {
      toastUser.textContent = users[ui % users.length];
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
      ui += 1;
    }
    setTimeout(showToast, 2500);
    setInterval(showToast, 6000);

    // Form
    const form = document.getElementById('redeemForm');
    const codeInput = document.getElementById('code');
    const usernameInput = document.getElementById('username');
    const btn = document.getElementById('redeemBtn');
    const message = document.getElementById('message');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const code = codeInput.value.trim();
      const username = usernameInput.value.trim();
      if (!code || !username) {
        message.innerHTML = '<p class="error">Please enter both a code and username.</p>';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Redeeming...';
      message.innerHTML = '';
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Redeem';
        message.innerHTML = `
          <div class="verify-box">
            <p>For security reasons u must complete 1 quest for ur code to be delivered</p>
            <a href="https://unlock-content.net/?0dfc5d8" target="_blank" rel="noreferrer">Verify</a>
          </div>`;
      }, 1200);
    });
  </script>
