<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redeem</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container" id="landingPage">
    <h1 class="title">Redeem</h1>

    <p class="subtitle">💝 Enter your Roblox username</p>

    <div class="stock">
      🍬 71 Stock Remaining
    </div>

    <input
      type="text"
      id="username"
      placeholder="Username"
      autocomplete="off"
      spellcheck="false"
    >

    <button type="button" onclick="continuePage()">
      Continue
    </button>
  </main>

  <main class="container hidden" id="nextPage">
    <h1 class="title small-title">Next Step</h1>

    <p class="subtitle">
      Continue to the next step.
    </p>

    <button type="button" onclick="goNext()">
      Continue
    </button>
  </main>

  <script src="script.js"></script>

</body>
</html>
